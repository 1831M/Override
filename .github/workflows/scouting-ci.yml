name: Scouting dashboard checks

on:
  push:
    branches: [main]
    paths:
      - "scouting/**"
      - "netlify.toml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scouting
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install VEX Events client
        run: npm install
      - name: Run syntax, analytics and UI checks
        run: npm run check
      - name: Build static dashboard
        run: npm run build
      - name: Smoke test production VEX feed
        run: |
          node --input-type=module <<'NODE'
          const url = "https://1831m-states-scouting-2026.netlify.app/.netlify/functions/live-data";
          const response = await fetch(url, {
            headers: { accept: "application/json" },
            signal: AbortSignal.timeout(90000)
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.ok !== true || !payload.snapshot) {
            console.error(`Production VEX feed failed: HTTP ${response.status}; ${payload.code || "NO_CODE"}; ${payload.message || "No snapshot returned"}`);
            process.exit(1);
          }
          const snapshot = payload.snapshot;
          console.log(JSON.stringify({
            ok: true,
            event: snapshot.event?.sku,
            teams: snapshot.teams?.length,
            matches: snapshot.matches?.length,
            rankings: snapshot.rankings?.length,
            skills: snapshot.skills?.length,
            awards: snapshot.awards?.length,
            fetchedAt: snapshot.fetchedAt,
            sourceErrors: snapshot.sourceErrors || [],
            sourceAvailability: snapshot.sourceAvailability || {},
            divisions: snapshot.event?.divisions || []
          }));
          NODE
