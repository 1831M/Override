name: Scouting dashboard checks

on:
  push:
    branches: [main]
    paths:
      - "scouting/**"
      - "netlify.toml"
      - ".github/workflows/scouting-ci.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scouting
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install VEX Events client
        run: npm install
      - name: Run syntax, analytics and UI checks
        run: npm run check
      - name: Build static dashboard
        run: npm run build
      - name: Smoke test production VEX feed
        run: |
          node --input-type=module <<'NODE'
          const url = "https://1831m-states-scouting-2026.netlify.app/.netlify/functions/live-data";
          const response = await fetch(url, {
            headers: { accept: "application/json" },
            signal: AbortSignal.timeout(90000)
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.ok !== true || !payload.snapshot) {
            console.error(`Production VEX feed failed: HTTP ${response.status}; ${payload.code || "NO_CODE"}; ${payload.message || "No snapshot returned"}`);
            process.exit(1);
          }
          const snapshot = payload.snapshot;
          const failures = [];
          if (snapshot.event?.sku !== "VE-V5-26-66512") failures.push("Unexpected event SKU");
          if (!Array.isArray(snapshot.teams) || snapshot.teams.length === 0) failures.push("Registered team roster is empty");
          if (snapshot.sourceAvailability?.teams !== true) failures.push("Registered team source is unavailable");
          if (!Array.isArray(snapshot.awards)) failures.push("Awards collection is not an array");
          if (snapshot.sourceAvailability?.awards !== true) failures.push("Awards source is unavailable");
          const divisions = snapshot.event?.divisions || [];
          if (!divisions.length) failures.push("Event has no published divisions");
          for (const division of divisions) {
            const key = division.name || String(division.id || "unknown");
            if (snapshot.sourceAvailability?.matches?.[key] !== true) failures.push("Match feed unavailable for " + key);
            if (snapshot.sourceAvailability?.rankings?.[key] !== true) failures.push("Ranking feed unavailable for " + key);
          }
          if (failures.length) {
            console.error("Production VEX feed integrity check failed:", failures.join("; "));
            process.exit(1);
          }
          console.log(JSON.stringify({
            ok: true,
            event: snapshot.event.sku,
            teams: snapshot.teams.length,
            matches: snapshot.matches?.length ?? 0,
            rankings: snapshot.rankings?.length ?? 0,
            skills: snapshot.skills?.length ?? 0,
            awards: snapshot.awards.length,
            fetchedAt: snapshot.fetchedAt,
            sourceAvailability: snapshot.sourceAvailability || {},
            divisions,
            sourceRecoveries: snapshot.sourceRecoveries || [],
            integrity: "event, roster, awards and every division feed verified"
          }));
          NODE
