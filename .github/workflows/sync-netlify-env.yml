name: Sync VEX Events token to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-vex-token-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Update Netlify production variable and deploy
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: 5699a25b-dbd2-4f37-b16e-598922ef6cec
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required repository secrets
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          VEX_EVENTS_TOKEN: ${{ secrets.VEX_EVENTS_TOKEN }}
        run: |
          missing=0
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret: NETLIFY_AUTH_TOKEN"
            missing=1
          fi
          if [ -z "${VEX_EVENTS_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret: VEX_EVENTS_TOKEN"
            missing=1
          fi
          exit "$missing"

      - name: Install scouting dependencies
        run: npm install --prefix scouting

      - name: Run project checks
        run: npm run check --prefix scouting

      - name: Store VEX token in Netlify
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          VEX_EVENTS_TOKEN: ${{ secrets.VEX_EVENTS_TOKEN }}
        run: |
          # Use the default all-scopes setting supported by this Netlify project.
          # The value is still stored in Netlify's encrypted environment-variable store.
          npx --yes netlify-cli@latest env:set VEX_EVENTS_TOKEN "$VEX_EVENTS_TOKEN" \
            --context production \
            --force \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN"

      - name: Build and deploy production
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes netlify-cli@latest deploy --build --prod \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN"
